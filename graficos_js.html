<script>

/**
 * Módulo:    dadosQuantitativos_js.html
 * Objetivo:  Módulo com funções que obtêm os dados quantitativos e gera seus gráficos
 */

  "use strict";  

  // Array para armazenar os valores X e Y do gráfico
  let quantitativoMotivosDeDesignacao;
  let labelMotivosDeDesignacao;
  let numMotivosDeDesignacao;

  // Arrays para armazenar os valores X e Y do gráfico Órgãos Encaminhadores
  let quantitativoOrgaosEncaminhadores;
  let labelOrgaosEncaminhadores;

  // Arrays para armazenar os valores X e Y do gráfico Categorias
  let quantitativoCategorias;
  let labelCategorias;

  // Arrays para armazenar os valores X e Y do gráfico Violações
  let quantitativoViolacoes;
  let labelViolacoes;
  let numViolacoes;

  // Arrays para armazenar os valores X e Y do gráfico Parâmetros
  let quantitativoParametros;
  let labelParametros;
  let numParametros;



  /**
   * Função que gera inicializa os labels dos gráficos
   */
  async function inicializarLabels() {

    // Aguarda carregamento das tabelas na cache de tabelas
    while( !tabelasCarregadasNaCache() ) {      
      await esperar( 1000 );
    }            

    // Inicializa os labels
    inicializarLabelsMotivosDeDesignacao();
    inicializarLabelsOrgaosEncaminhadores();
    inicializarLabelsCategorias();
    inicializarLabelsViolacoes();
    inicializarLabelsParametros();

  } // Fim da função inicializarLabels

  

  /**
   * Função que gera os quantitativos
   */
  async function contabilizarDados() {

    if( !abaGraficos ) return false;

    // Aguarda carregamento das tabelas na cache de tabelas
    while( !tabelasCarregadasNaCache() ) {      
      await esperar( 1000 );
    }            

    // Inicializa os contadores
    numMotivosDeDesignacao = cache_TabelaMotivosDeDesignacao.length;
    quantitativoMotivosDeDesignacao = new Array( numMotivosDeDesignacao + 1 ).fill( 0 );

    quantitativoOrgaosEncaminhadores = new Array( cache_TabelaOrgaosEncaminhadores.length ).fill( 0 );

    quantitativoCategorias = new Array( cache_TabelaCategorias.length ).fill( 0 );    

    numViolacoes = cache_TabelaViolacoes.length;
    quantitativoViolacoes = new Array( numViolacoes + 1 ).fill( 0 );    

    numParametros = cache_TabelaParametros.length;
    quantitativoParametros = new Array( numParametros + 1 ).fill( 0 );    


    // Contabiliza a quantidade de casos em cada situação
    casosFiltrados.forEach( caso => {   
      contabilizarMotivosDeDesignacao( caso );
      contabilizarOrgaosEncaminhadores( caso );
      contabilizarCategorias( caso );
      contabilizarViolacoes( caso );
      contabilizarParametros( caso )
    });    
  
  } // Fim da função contabilizarDados



  /**
   * Função que gera os gráficos
   */
  function gerarGraficos() {

    if( !abaGraficos ) return false;

    gerarGraficoMotivosDeDesignacao();
    gerarGraficoOrgaosEncaminhadores();
    gerarGraficoCategorias();
    gerarGraficoViolacoes();
    gerarGraficoParametros();

  } // Fim da função gerarGraficos




// #############  MOTIVOS DE DESIGNAÇÃO  #############


  /**
   * Função que gera inicializa os labels do gráfico Motivos de Designação
   */
  function inicializarLabelsMotivosDeDesignacao() {

    // Gera os Labels do gráfico com os nomes dos motivos de designação
    labelMotivosDeDesignacao = [];
    cache_TabelaMotivosDeDesignacao.forEach( sit_beneficio => {
      labelMotivosDeDesignacao.push( sit_beneficio[COLUNA_NOME] );  
    });
    labelMotivosDeDesignacao.push( "NÃO DESIGNADO" );  

  } // Fim da função inicializarLabelsMotivosDeDesignacao


  /**
   * Função que contabiliza a quantidade de cada tipo de motivo de designação do caso
   */
  function contabilizarMotivosDeDesignacao( caso ) {
   
    if( caso.idMotivoDeDesignacao != "" ) {
      ++(quantitativoMotivosDeDesignacao[ parseInt(caso.idMotivoDeDesignacao) - 1 ]);
    } else {
      ++(quantitativoMotivosDeDesignacao[ numMotivosDeDesignacao ]);  
    }            

  } // Fim da função contabilizarMotivosDeDesignacao


  /**
   * Função que gera o gráfico de barras da quantidade de cada tipo de motivo de designação de casos
   */
  function gerarGraficoMotivosDeDesignacao() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoMotivosDeDesignacao" );    
    
    const data = [{
      x:labelMotivosDeDesignacao,
      y:quantitativoMotivosDeDesignacao,
      type:"bar",
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoMotivosDeDesignacao.map(String),      
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Motivos de Designação</b>" },                  
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoMotivosDeDesignacao 



  // #############  GRÁFICO ÓRGÃOS ENCAMINHADORES  #############  


  /**
   * Função que gera inicializa os labels do gráfico Orgaos Encaminhadores
   */
  function inicializarLabelsOrgaosEncaminhadores() {

    // Gera os Labels do gráfico com os nomes dos Órgãos Encaminhadores
    labelOrgaosEncaminhadores = [];
    cache_TabelaOrgaosEncaminhadores.forEach( orgaoEncaminhador => {
      labelOrgaosEncaminhadores.push( orgaoEncaminhador[COLUNA_NOME] );  
    });

  } // Fim da função inicializarLabelsOrgaosEncaminhadores


  /**
   * Função que contabiliza a quantidade de Órgãos Encaminhadores do caso
   */
  function contabilizarOrgaosEncaminhadores( caso ) {

    let orgaosEncaminhadoresCaso = caso.idsOrgaosEncaminhadores.split(";");
    let numOrgaosEncaminhadoresCaso = orgaosEncaminhadoresCaso.length; 
    
    for( let i=0; i<numOrgaosEncaminhadoresCaso; ++i)  {
      if( orgaosEncaminhadoresCaso[i] != "" ) {
        ++quantitativoOrgaosEncaminhadores[i];                   
      }          
    }

  } // Fim da função contabilizarOrgaosEncaminhadores


  /**
   * Função que gera o gráfico de barras da quantidade de Órgãos Encaminhadores
   */
  function gerarGraficoOrgaosEncaminhadores() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoOrgaosEncaminhadores" );    
    
    const data = [{
      x:labelOrgaosEncaminhadores,
      y:quantitativoOrgaosEncaminhadores,
      type:"bar",      
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoOrgaosEncaminhadores.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Órgãos Encaminhadores</b>" },                        
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoOrgaosEncaminhadores   



  // #############  GRÁFICO CATEGORIAS  #############  


  /**
   * Função que gera inicializa os labels do gráfico Categorias
   */
  function inicializarLabelsCategorias() {

    // Gera os Labels do gráfico com os nomes das categorias
    labelCategorias = [];
    cache_TabelaCategorias.forEach( categoria => {      
      labelCategorias.push( categoria[COLUNA_NOME] );  
    });

  } // Fim da função inicializarLabelsCategorias  


  /**
   * Função que contabiliza a quantidade de Categorias do caso
   */
  function contabilizarCategorias( caso ) {

    let categoriasCaso = caso.idsCategorias.split(";");
    let numCategoriasCaso = categoriasCaso.length;

    for( let i=0; i<numCategoriasCaso; ++i)  {
      if( categoriasCaso[i] != "" ) {
        ++quantitativoCategorias[i];
      }          
    }

  } // Fim da função contabilizarCategorias


  /**
   * Função que gera o gráfico de barras da quantidade de categorias dos casos
   */
  function gerarGraficoCategorias() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoCategorias" );    
    
    const data = [{
      x:labelCategorias,
      y:quantitativoCategorias,
      type:"bar",      
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoCategorias.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Categorias</b>" },                        
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoCategorias   



  // #############  GRÁFICO VIOLAÇÕES  #############  


  /**
   * Função que gera inicializa os labels do gráfico Violacoes
   */
  function inicializarLabelsViolacoes() {

    // Gera os Labels do gráfico com os nomes resumidos das violações
    labelViolacoes = [
      "Violência física/psicológica",
      "Violência sexual, abuso/exploração sexual",
      "Afastamento do convívio familiar",
      "Tráfico de pessoas",
      "Situação de rua ou mendicância",
      "Abandono",
      "Vivência de trabalho infantil",
      "Discriminação devido a orientação sexual/etnia",
      "Outras formas de violação de direitos",
      "Descumprimento de condicionalidades",
      "Negligência",
      "VIOLAÇÕES NÃO INFORMADAS"      
    ];

  } // Fim da função inicializarLabelsViolacoes  


  /**
   * Função que contabiliza a quantidade de Violações do caso
   */
  function contabilizarViolacoes( caso ) {
      
    if( caso.idsViolacoes != ";;;;;;;;;;" ) {
      let violacoesCaso = caso.idsViolacoes.split(";");
      let numViolacoesCaso = violacoesCaso.length;

      for( let i=0; i<numViolacoesCaso; ++i)  {
        if( violacoesCaso[i] != "" ) {
          ++quantitativoViolacoes[i];
        }                   
      }
    } else {
      ++quantitativoViolacoes[numViolacoes];
    }

  } // Fim da função contabilizarViolacoes


  /**
   * Função que gera o gráfico de barras da quantidade de Violações dos casos
   */
  function gerarGraficoViolacoes() {

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoViolacoes" );    
    
    const data = [{
      x:labelViolacoes,
      y:quantitativoViolacoes,
      type:"bar",      
      textposition: 'auto',
      orientation:"v",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoViolacoes.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Violações</b>" },                        
      height: 500, // Altura total  
      xaxis: {
        tickangle: -45,
        automargin: true
      }      
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoViolacoes

  } // Fim da função inicializarLabelsParametros


  /**
   * Função que contabiliza a quantidade de Parâmetros do caso
   */
  function contabilizarParametros( caso ) {
      
    if( caso.idsParametros != ";;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;" ) {
      let parametrosCaso = caso.idsParametros.split(";");
      let numParametrosCaso = parametrosCaso.length;

      for( let i=0; i<numParametrosCaso; ++i)  {
        if( parametrosCaso[i] != "" ) {
          ++quantitativoParametros[i];
        }          
      }
    } else {
      ++quantitativoParametros[numParametros];
    }

  } // Fim da função contabilizarParametros


  /**
   * Função que gera o gráfico de barras da quantidade de parâmetros dos casos
   */
  function gerarGraficoParametros() {

    // Filtra apenas os parâmetros ativos
    let quantitativoParametrosAtivos = [];
    let labelParametrosAtivos = [];
    for( let i=0; i<numParametros; ++i ) {

      if( cache_TabelaParametros[i][COLUNA_ATIVO] == 1 ) {

        quantitativoParametrosAtivos.push( quantitativoParametros[i] );
        labelParametrosAtivos.push( labelParametros[i] );
      }
    }
    quantitativoParametrosAtivos.push( quantitativoParametros[numParametros] );
    labelParametrosAtivos.push( labelParametros[numParametros] );


    const quantitativoParametrosAtivosReversed = quantitativoParametrosAtivos.toReversed();
    const labelParametrosAtivosReversed = labelParametrosAtivos.toReversed();

    // Gera o gráfico usando a biblioteca plotly.js
    const grafico = document.getElementById( "plotQuantitativoParametros" );    
    
    const data = [{
      x:quantitativoParametrosAtivosReversed,
      y:labelParametrosAtivosReversed,
      type:"bar",      
      textposition: 'auto',
      orientation:"h",
      marker: {color:"rgba(0,0,255,0.6)"},
      text: quantitativoParametrosAtivosReversed.map(String),
      hovertemplate: '%{x}: %{y}<br>' +                     
                     '<extra></extra>' // Hides the trace name box                     
    }];
    
    const layout = {
      title: { text: "<b>Parâmetros</b>" },            
      height: 900, // Altura total  
      xaxis: {
        automargin: true
      },      
      yaxis: {
//        tickangle: -45,        
        automargin: true
      }
    };

    const config = {
      responsive: true,
      displayModeBar: false
    };      
    
    Plotly.newPlot(grafico, data, layout, config);

  } // Fim da função gerarGraficoParametros   
  

</script>
